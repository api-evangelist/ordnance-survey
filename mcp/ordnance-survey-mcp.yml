description: A candidate MCP tool surface for the Ordnance Survey APIs, one tool per OpenAPI operation
  that an agent would realistically call. Every tool's source_operation points at a real path/operationId
  in a spec in this repo, so the tool's input schema is the operation's parameters verbatim - nothing
  here is invented. This is a design starting point for whoever builds the server (OS itself, or a third
  party); it is NOT a published Ordnance Survey product.
server:
  name: ordnance-survey
  transport: http
  url: null
  auth: All OS APIs authenticate with a Project API Key (query parameter `key` or request header `key`)
    or an OAuth 2.0 client-credentials Bearer token from https://api.os.uk/oauth2/token/v1. A server implementation
    would hold the key/secret and never expose it to the model.
  read_only: true
  note: Every OS operation is a read. The only non-GET operation in the estate is OS Places POST /polygon,
    which is a query-by-request-body, not a write. An MCP server over OS therefore needs no write consent
    model.
tools:
- name: search_addresses
  description: Free-text address search over AddressBase Premium; returns matched addresses with UPRNs.
  source_operation: openapi/ordnance-survey-places-openapi.json#getFind
  licensing: Premium or PSGA
- name: get_addresses_by_postcode
  description: Return addresses for a postcode.
  source_operation: openapi/ordnance-survey-places-openapi.json#getPostcode
  licensing: Premium or PSGA
- name: get_address_by_uprn
  description: Return the address record for a Unique Property Reference Number.
  source_operation: openapi/ordnance-survey-places-openapi.json#getUPRN
  licensing: Premium or PSGA
- name: get_nearest_address
  description: Return the closest addresses to an X/Y coordinate pair.
  source_operation: openapi/ordnance-survey-places-openapi.json#getNearest
  licensing: Premium or PSGA
- name: get_addresses_in_bbox
  description: Return addresses inside a bounding box.
  source_operation: openapi/ordnance-survey-places-openapi.json#getBbox
  licensing: Premium or PSGA
- name: get_addresses_in_radius
  description: Return addresses intersected by a circle around a point.
  source_operation: openapi/ordnance-survey-places-openapi.json#getRadius
  licensing: Premium or PSGA
- name: get_addresses_in_polygon
  description: Return addresses inside a GeoJSON polygon or multi-polygon.
  source_operation: openapi/ordnance-survey-places-openapi.json#postPolygon
  licensing: Premium or PSGA
- name: search_place_names
  description: Fuzzy free-text search of the OS gazetteer of places, roads and settlements.
  source_operation: openapi/ordnance-survey-names-openapi.json#findAddress
  licensing: Premium or PSGA
- name: get_nearest_place_name
  description: Find the gazetteer features closest to a point.
  source_operation: openapi/ordnance-survey-names-openapi.json#nearestAddress
  licensing: Premium or PSGA
- name: resolve_linked_identifier
  description: Resolve an identifier (UPRN, TOID, USRN) to its linked identifiers - the join key between
    OS data, HM Land Registry and local authority records.
  source_operation: openapi/ordnance-survey-linked-identifiers-openapi.json#GET /identifiers/{id}
  note: The published spec fragment declares no operationId for this operation.
  licensing: OS OpenData (OS Open Linked Identifiers)
- name: resolve_linked_identifier_by_type
  description: Resolve an identifier when the identifier type is known.
  source_operation: openapi/ordnance-survey-linked-identifiers-openapi.json#GET /identifierTypes/{identifierType}/{id}
  note: The published spec fragment declares no operationId for this operation.
- name: resolve_linked_identifier_by_feature_type
  description: Resolve an identifier when the feature type is known.
  source_operation: openapi/ordnance-survey-linked-identifiers-openapi.json#GET /featureTypes/{featureType}/{id}
  note: The published spec fragment declares no operationId for this operation.
- name: get_linked_identifiers_product_version
  description: Return source product version details for a correlation method.
  source_operation: openapi/ordnance-survey-linked-identifiers-openapi.json#GET /productVersionInfo/{correlationMethod}
  note: The published spec fragment declares no operationId for this operation.
