aid: ordnance-survey
url: https://raw.githubusercontent.com/api-evangelist/ordnance-survey/refs/heads/main/apis.yml
name: Ordnance Survey
kind: company
description: 'Ordnance Survey is Great Britain''s national mapping agency, a government-owned company
  that maintains the addressing and mapping layer the UK property market runs on - the Unique Property
  Reference Number (UPRN), the TOID, AddressBase, and the OS National Geographic Database. The UK has
  no MLS; residential listings sit behind the Rightmove/Zoopla duopoly and agency CRM software, so the
  open layer in this market is public-sector rather than private, and OS is one half of it alongside
  HM Land Registry. Its API posture is unusually honest for this sector - the OS Data Hub is a self-serve
  developer portal with real machine-readable contracts, including OGC-conformant OpenAPI 3.0 documents
  served live and anonymously at api.os.uk for OS NGD API - Features and Tiles, plus published OpenAPI
  for the OS Downloads and OS Net APIs. The split that matters is licensing, not reachability: OS OpenData
  products (OS Open UPRN, OS Open TOID, Code-Point Open, OS Open Names, Boundary-Line, OS Open Linked
  Identifiers) are free and downloadable with no API key at all through the OS Downloads API, while
  the premium addressing and mapping products behind OS Places API, OS Features API, and the NGD collections
  require a paid Premium plan or Public Sector Geospatial Agreement (PSGA) membership. RESO plays no
  part here - the Real Estate Standards Organization standards are a US MLS construct and appear nowhere
  in the OS estate. Home market is the United Kingdom.'
imageNote: >-
  The `image` property was removed on 2026-08-26. It had been copied verbatim out of a
  bootstrap template and pointed at an icon belonging to groq, not to this company.
  That asset returns HTTP 200, so the record rendered another company's brand
  rather than a broken image, which is why it went unreported (roadmap#153).
  No correct icon has been sourced yet. Shipping the wrong company's mark is worse
  than shipping none; re-run the icon backfill once a real asset exists.
