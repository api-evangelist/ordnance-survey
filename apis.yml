- aid: ordnance-survey:os-match-and-cleanse-api
  name: OS Match & Cleanse API (withdrawn)
  description: 'Matched and cleansed supplied address strings against OS authoritative addressing data,
    returning a matched AddressBase record and confidence score. WITHDRAWN: end of life 31 March 2026,
    announced 24 February 2025. The API has been removed from existing API projects and requests now
    fail. OS recommends the OS Places API FIND endpoint, or an OS Partner bulk address-matching solution,
    as the migration path.'
  humanURL: https://docs.os.uk/os-apis/accessing-os-apis/os-match-and-cleanse-api
  baseURL: https://api.os.uk/search/match/v1
