surfaceInventory:
  documentedAPIs: 12
  specsPublished: 4
  webhooks:
    present: false
    note: No webhook, event, or callback surface is documented for any OS API; the model is
      request/response plus bulk download. Absence is the finding.
  asyncapi:
    present: false
    note: No streaming, WebSocket, or messaging surface documented.
  graphql:
    present: false
  mcp:
    present: false
    note: No MCP server published; the agent-facing surface OS does publish is llms.txt /
      llms-full.txt and Markdown-negotiated docs.
  sdks:
    - name: osdatahub (Python)
      url: https://github.com/OrdnanceSurvey/osdatahub
      note: Official OS Python package, on PyPI, actively updated (2026-07-22).
    - name: osbng-py / osbng-r
      note: Official British National Grid indexing packages for Python and R.
  postman:
    present: false
    note: https://www.postman.com/ordnancesurvey returned 200 but the page did not resolve
      to a confirmed public OS workspace; no Postman collection is claimed.
  demoCode:
    - https://github.com/OrdnanceSurvey/OS-Data-Hub-API-Demos
    - https://github.com/OrdnanceSurvey/os-data-hub-tutorials
    - https://labs.os.uk/public/os-data-hub-examples/
sources:
  - url: https://osdatahub.os.uk/
    type: DeveloperPortal
    note: Self-serve signup, project creation, API key issuance.
  - url: https://docs.os.uk/os-apis
    type: Documentation
    note: Names all 12 APIs; Markdown and llms.txt variants available.
  - url: https://api.os.uk/
    type: APIReference
    note: Hypermedia root enumerating every OS API grouping.
  - url: https://docs.os.uk/os-apis/accessing-os-apis/oauth-2-api
    type: Documentation
    note: OAuth 2 client-credentials pattern, backend-proxy guidance, no data-layer scoping.
  - url: https://docs.os.uk/os-apis/accessing-os-apis/os-places-api
    type: Documentation
    note: AddressBase Premium coverage for UK, Jersey, Guernsey, Isle of Man; daily updates.
  - url: https://www.ordnancesurvey.co.uk/developers/os-data-hub
    type: Documentation
    note: Plan names and terms — OS OpenData Plan (free, unlimited), Premium Plan (free
      premium transactions up to £1,000 per month), Public Sector Plan (PSGA members only).
