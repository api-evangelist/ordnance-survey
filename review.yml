aid: ordnance-survey
name: Ordnance Survey
review:
  question: Does Ordnance Survey expose a real, reachable public developer surface for
    UK property data, and what does a developer have to sign or join to use it?
  answer: true
  date: '2026-07-26'
  reviewer: API Evangelist
  homeMarket: United Kingdom
  tier: land-registry-govt
sectorPosture:
  resoPosture: >-
    No RESO reference found. Ordnance Survey is Great Britain's national mapping
    agency, not an MLS or listing platform. Nothing in the OS estate references the
    Real Estate Standards Organization: no RESO Web API certification, no RESO Data
    Dictionary version, no listing in the RESO certification directory, no OData
    service root and no $metadata document anywhere under api.os.uk, and no Universal
    Property Identifier (UPI). The UK equivalent of a universal property identifier
    is OS's own Unique Property Reference Number (UPRN) — a national, government-issued
    identifier that predates and is independent of RESO's UPI, and which OS publishes
    as free open data (OS Open UPRN). A targeted site-scoped search for RESO across
    os.uk returned only OS API documentation pages and no RESO content.
  resoCertified: false
  resoEvidence:
    - probe: site-scoped web search for "Ordnance Survey" + RESO on os.uk
      result: no RESO pages; results were OS Places / OS Features / OS APIs docs only
    - probe: enumerated every api.os.uk grouping (maps, features, search, downloads, positioning)
      result: OGC API and REST/RPC services only; no OData service root, no $metadata
  accessGate: self-serve
  accessGateDetail: >-
    A developer signs up for a free OS Data Hub account at https://osdatahub.os.uk/
    (HTTP 200, live, public — not a member login), creates a project, and is issued a
    project API key and secret from the dashboard. Three plans exist. The OS OpenData
    Plan is free with unlimited usage over open datasets. The Premium Plan is also
    self-serve and carries a free allowance of premium API transactions up to
    £1,000 per month before charges begin, and includes OpenData access. The Public
    Sector Plan is the only gated tier: it is exclusive to members of the Public Sector
    Geospatial Agreement (PSGA) and gives free unlimited access to open and premium
    data. There is no MLS membership, no board or association requirement, no IDX/VOW
    licence, no broker sponsorship, and no partner deal required for the self-serve
    tiers. Premium products (AddressBase Premium behind OS Places API, OS MasterMap
    behind OS Features API and the Vector Tile API, and premium NGD collections) are
    commercially licensed under OS terms and metered — licensed, but obtainable by
    anyone who signs up and pays.
  openData: true
  openDataDetail: >-
    Genuinely open and callable with no key at all. GET https://api.os.uk/downloads/v1/products
    returned HTTP 200 anonymously and listed 26 open products: OS Open UPRN, OS Open TOID,
    OS Open USRN, OS Open Names, OS Open Linked Identifiers, OS Open Roads, OS Open Rivers,
    OS Open Greenspace, OS Open Built Up Areas, OS Open Zoomstack, OS OpenMap - Local,
    Code-Point Open, Boundary-Line, MiniScale, GB Overview Maps, OS Terrain 50,
    OS VectorMap District, 1:250 000 Scale Colour Raster, and nine BGS/UKHSA third-party
    open datasets. GET /products/OpenUPRN and /products/OpenUPRN/downloads also returned
    200 anonymously with direct zip URLs (osopenuprn_202606_csv.zip, 617,876,071 bytes,
    md5 published). OS documents OS Open UPRN as "an open dataset". The exact licence
    text (commonly cited as the Open Government Licence for OS OpenData) was NOT confirmed
    on any page probed in this pass — the product JSON carries no licence field and the
    OS Open UPRN overview page does not state one — so it is recorded here as unverified
    rather than asserted.
  authModel: >-
    API key or OAuth 2.0 client credentials. Both harvested OpenAPI families declare the
    same three schemes: apiKey named "key" in query, apiKey named "key" in header, and
    oauth2 clientCredentials with tokenUrl https://api.os.uk/oauth2/token/v1 and an empty
    scopes object (no named scopes are published). GET on the token URL returned 404
    text/plain, consistent with a POST-only token endpoint. There is no OpenID Connect
    discovery: GET https://api.os.uk/.well-known/openid-configuration returned HTTP 200
    application/json but the body is the generic api.os.uk landing document, not an OIDC
    configuration — api.os.uk answers unmatched paths with that landing doc, so the 200 is
    not evidence of OIDC. No SAML, no member-portal federation.
  marketSeamNote: >-
    The UK has no MLS and no industry-mandated machine-readable listing contract. Residential
    listings are controlled by the Rightmove/Zoopla portal duopoly and reach those portals
    through agency CRM software. The counterweight is public-sector open data, and Ordnance
    Survey supplies one half of it — the addressing and geometry spine (UPRN, TOID, USRN,
    AddressBase, OS NGD) — with HM Land Registry supplying the ownership and price-paid half.
    OS is a government-owned company that sells licensed products, so the privatised-registry
    pattern is present, but it is partial and disclosed: the identifiers themselves (UPRN,
    TOID, USRN) and the small-scale mapping are given away free, while the detailed address
    and topography products they identify are sold.
findings:
  developerPortal:
    url: https://osdatahub.os.uk/
    status: 200
    confirmed: true
    note: >-
      Live self-serve OS Data Hub. The legacy portal at developer.ordnancesurvey.co.uk
      returns 200 after redirecting to
      https://www.ordnancesurvey.co.uk/developers/os-apis-developer-portal, a page that
      states the old developer portal is discontinued and directs new users to the OS Data Hub.
  documentation:
    url: https://docs.os.uk/os-apis
    status: 200
    note: >-
      GitBook-hosted. Agent-friendly: every page is available as Markdown by appending .md,
      and an index is published at https://docs.os.uk/os-apis/llms.txt (200, 19,664 bytes)
      with a full corpus at https://docs.os.uk/os-apis/llms-full.txt (200, 477,253 bytes).
  apiRoot:
    url: https://api.os.uk/
    status: 200
    note: >-
      A hypermedia landing document titled "Welcome to Ordnance Survey's APIs" with
      api-grouping links to /maps, /features, /search, /downloads, /positioning. The same
      document is served at https://api.os.uk/openapi.json (200) despite the filename — it
      is a link document, NOT an OpenAPI definition, and was not saved as a spec.
